<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Real Estate App</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
    <h2 class="text-center">Login</h2>
    <form th:action="@{/auth/login}" method="post" class="mt-4">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100 mt-4" type="submit">Login</button>
    </form>
    <p class="mt-3 text-center">
        <a th:href="@{/auth/forgot-password}">Forgot Password?</a>
        |
        <a th:href="@{/auth/signup}">Sign Up</a>
    </p>
<div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
