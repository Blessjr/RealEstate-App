<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Properties - Real Estate</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">
    <h2 class="text-center mb-4">Available Properties</h2>

    <div class="row">
        <div class="col-12 mb-3 text-end">
            <a th:href="@{/properties/add}" class="btn btn-primary">Add Property</a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4" th:each="property : ${properties}">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${property.title}">Property Title</h5>
                    <p class="card-text" th:text="${property.description}">Description</p>
                    <p><strong>Location:</strong> <span th:text="${property.location}">Location</span></p>
                    <p><strong>Price:</strong> $<span th:text="${property.price}">Price</span></p>
                    <a th:href="@{'/properties/delete/' + ${property.id}}" class="btn btn-danger btn-sm">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
