# Server settings
server.port=8080

# Database settings (example with MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password= 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf settings
spring.thymeleaf.cache=false

# JWT settings
app.jwtSecret=yourSuperSecretJWTKey
app.jwtExpirationMs=86400000

# Email settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_gmail_here@gmail.com
spring.mail.password=your_gmail_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
