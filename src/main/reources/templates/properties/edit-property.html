<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Property</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">
    <h2>Edit Property</h2>
    <form th:action="@{/property/edit/{id}(id=${property.id})}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Property Title</label>
            <input type="text" id="title" name="title" class="form-control" th:value="${property.title}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="4" required th:text="${property.description}"></textarea>
        </div>

        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" name="price" class="form-control" th:value="${property.price}" required>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" class="form-control" th:value="${property.location}" required>
        </div>

        <div class="form-group">
            <label for="image">Upload New Image (optional)</label>
            <input type="file" id="image" name="image" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary mt-3">Update Property</button>
    </form>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
