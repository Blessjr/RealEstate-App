<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | RealEstateApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">RealEstate Admin</a>
        <form class="d-flex">
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </form>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 bg-light p-3">
            <h5>Navigation</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="/admin/users" class="nav-link">Manage Users</a></li>
                <li class="nav-item"><a href="/admin/properties" class="nav-link">Manage Properties</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-white bg-primary mb-3">
                        <div class="card-header">Total Buyers</div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${buyersCount}">0</h5>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-white bg-success mb-3">
                        <div class="card-header">Total Sellers</div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${sellersCount}">0</h5>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-white bg-warning mb-3">
                        <div class="card-header">Total Properties</div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${propertiesCount}">0</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    Latest Inquiries
                </div>
                <div class="card-body">
                    <p th:if="${inquiries.size() == 0}">No inquiries yet.</p>
                    <ul class="list-group" th:each="inquiry : ${inquiries}">
                        <li class="list-group-item">
                            <b th:text="${inquiry.buyer.name}">Buyer Name</b> - <span th:text="${inquiry.message}">Message</span>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
