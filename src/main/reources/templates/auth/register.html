<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up - Real Estate App</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
    <h2 class="text-center">Sign Up</h2>
    <form th:action="@{/auth/signup}" method="post" class="mt-4">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="fullName" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label>Role</label>
            <select name="role" class="form-control" required>
                <option value="BUYER">Buyer</option>
                <option value="SELLER">Seller</option>
                <option value="AGENT">Agent</option>
            </select>
        </div>
        <button class="btn btn-success w-100 mt-4" type="submit">Sign Up</button>
    </form>
    <p class="mt-3 text-center">
        Already have an account? <a th:href="@{/auth/login}">Login here</a>
    </p>
<div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
